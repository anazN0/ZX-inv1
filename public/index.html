<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8b923"><title>Zolvex Docs</title>
<style>
:root{--bg:#f5f5f2;--pn:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ln:#dcdcd6;--ac:#e8b923;--rd:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--pn:#222220;--tx:#f0f0ec;--mu:#9a9a94;--ln:#3a3a36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Segoe UI",Roboto,Arial,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:12px}h2{margin:8px 0 12px;font-size:20px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
input,select,textarea,button{font:inherit;color:var(--tx)}input,select,textarea{width:100%;min-height:44px;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin-bottom:8px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:2px}button,.b{min-height:44px;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:#1d1d1b;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.g{background:none;border:1px solid var(--ln);color:var(--tx)}.w{width:100%}.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.n{font-size:26px;font-weight:700}.m{color:var(--mu);font-size:13px}
.it{display:grid;grid-template-columns:1fr 56px 74px 84px;gap:6px}.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);text-decoration:none;color:inherit}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--pn);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}nav a{flex:1;text-align:center;padding:12px 2px;color:var(--mu);text-decoration:none;font-size:13px;min-height:48px}nav a.on{color:var(--tx);font-weight:700;border-top:3px solid var(--ac)}
.e{color:var(--rd)}table{width:100%;border-collapse:collapse}td{padding:4px 0}td+td{text-align:right}
</style></head><body><main id="a"></main><nav id="nv" hidden></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=p=>"₹"+(p/100).toLocaleString("en-IN",{minimumFractionDigits:2}),fail=e=>e&&e.message&&alert(e.message),today=()=>new Date().toISOString().slice(0,10);
let ME=null,CFG={};
async function api(u,m="GET",b){const r=await fetch("/api"+u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));
 if(r.status===401&&u!="/login"){ME=null;go();throw 0}if(!r.ok)throw new Error(j.error||"Something went wrong");return j}
const TPL={house:{t:"House Deep Cleaning",p:["Deep cleaning of the kitchen, including cabinet interiors and exteriors.","Deep cleaning of bathrooms, including toilets, tiles, and fittings.","Dusting and wiping of furniture, doors, windows, and accessible surfaces.","Floor scrubbing and mopping throughout the house.","Cleaning of window grills, switchboards, and accessible fixtures.","Cobweb removal and cleaning of corners.","Sofa vacuuming."],x:"Sofa shampooing, mattress shampooing, appliance interior cleaning, and heavy furniture shifting are excluded unless specifically mentioned in the quotation."}};
const ST={pending:"Pending",accepted:"Accepted",rejected:"Rejected",converted:"Converted",unpaid:"Unpaid",partial:"Partially paid",paid:"Paid"};
const row=d=>`<a class="li" href="#/d/${d.id}"><div><b>${E(d.number)}</b><div class="m">${E(d.customer)} · ${d.date}</div></div><div style="text-align:right">${inr(d.grand)}<div class="m">${d.status=="draft"?"Draft · ":""}${ST[d.kind=="Q"?d.quote_status:d.payment_status]}</div></div></a>`;
async function go(){const a=$("#a"),h=location.hash||"#/";
 if(!ME){try{ME=await api("/me");CFG=await api("/settings")}catch{$("#nv").hidden=true;return login()}}
 $("#nv").hidden=false;$("#nv").innerHTML=[["#/","Home"],["#/new","New"],["#/customers","Customers"],["#/docs","Documents"],["#/settings","Settings"]].map(([x,t])=>`<a href="${x}" class="${h==x?"on":""}">${t}</a>`).join("");
 try{if(h=="#/")await home();else if(h.startsWith("#/new")||h.startsWith("#/edit/"))await form(h.split("/")[2]);else if(h.startsWith("#/d/"))await view(h.split("/")[2]);else if(h=="#/docs")await docs();else if(h=="#/customers")await custs();else if(h=="#/settings")await sets();}catch(e){fail(e)}}
function login(){$("#a").innerHTML=`<div class="c" style="margin-top:12vh"><h2>Zolvex Docs</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="w" id="lg">Log in</button></div>`;
 const f=async()=>{try{await api("/login","POST",{email:$("#em").value,password:$("#pw").value});go()}catch(e){fail(e)}};$("#lg").onclick=f;$("#pw").onkeydown=e=>e.key=="Enter"&&f()}
async function home(){const[s,l]=await Promise.all([api("/dashboard"),api("/documents")]);
 $("#a").innerHTML=`<h2>Hi ${E(ME.name)}</h2><div class="grid">${[["Quotations",s.quotations],["Invoices",s.invoices],["Pending quotes",s.pending_quotations],["Accepted quotes",s.accepted_quotations],["Paid invoices",s.paid_invoices],["Unpaid invoices",s.unpaid_invoices]].map(([t,n])=>`<div class="c"><div class="n">${n}</div><div class="m">${t}</div></div>`).join("")}</div><div class="r" style="margin-bottom:10px"><a class="b" href="#/new?k=Q">+ Quotation</a><a class="b" href="#/new?k=I">+ Invoice</a></div><div class="c"><b>Recent</b>${l.slice(0,8).map(row).join("")||'<p class="m">Nothing yet. Create your first quotation.</p>'}</div>`}
async function docs(){$("#a").innerHTML=`<h2>Documents</h2><input id="q" placeholder="Search number or customer"><div class="r"><select id="k"><option value="">All types<option value="Q">Quotations<option value="I">Invoices</select><select id="s"><option value="">Any status${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}`).join("")}</select></div><div class="r"><div><label>From</label><input id="f" type="date"></div><div><label>To</label><input id="t" type="date"></div></div><div class="c" id="l"></div>`;
 const run=async()=>{const p=new URLSearchParams({q:$("#q").value,kind:$("#k").value,status:$("#s").value,from:$("#f").value,to:$("#t").value});for(const[k,v]of[...p])if(!v)p.delete(k);$("#l").innerHTML=(await api("/documents?"+p)).map(row).join("")||'<p class="m">No documents found.</p>'};
 document.querySelectorAll("#a input,#a select").forEach(e=>e.oninput=()=>run().catch(fail));run()}
let F=null;
async function form(id){const cu=await api("/customers");let d=null;
 if(id){d=await api("/documents/"+id);F={k:d.kind,co:d.company,cu:d.customer_id,dt:d.date,it:d.items.map(i=>[i.desc,i.qty||"",i.rate||"",i.amount===undefined?"":i.amount]),gm:d.gst_mode,is:d.interstate,dc:d.discount,sc:d.scope||{points:[],exclusions:""},tp:""}}
 else if(!F||F.id!==undefined||F.done)F={k:(location.hash.match(/k=(\w)/)||[])[1]||"Q",co:"Z",cu:cu[0]?cu[0].id:"",dt:today(),it:[["","","",""]],gm:"none",is:0,dc:0,sc:{points:[],exclusions:""},tp:""};
 F.id=id;const draw=()=>{const o=(v,t,s)=>`<option value="${v}" ${s==v?"selected":""}>${t}`;
 $("#a").innerHTML=`<h2>${id?"Edit "+E(d.number):"New document"}</h2><div class="c"><div class="r"><div><label>Type</label><select id="k" ${id?"disabled":""}>${o("Q","Quotation",F.k)}${o("I","Invoice",F.k)}</select></div><div><label>Company</label><select id="co" ${id?"disabled":""}>${o("Z","Zolvex",F.co)}${o("C","Cyril Ventures",F.co)}</select></div></div>
 <label>Customer</label><select id="cu">${cu.map(c=>o(c.id,c.code+" · "+c.name,F.cu)).join("")}</select><a href="#/customers" class="m">+ Add new customer</a><label style="margin-top:8px">Date</label><input id="dt" type="date" value="${F.dt}"></div>
 <div class="c"><b>Services</b><div class="m" style="margin-bottom:6px">Leave Amount blank to use Qty × Rate</div>${F.it.map((r,i)=>`<div class="it"><input data-i="${i}" data-j="0" placeholder="Service" value="${E(r[0])}"><input data-i="${i}" data-j="1" inputmode="decimal" placeholder="Qty" value="${E(r[1])}"><input data-i="${i}" data-j="2" inputmode="decimal" placeholder="Rate" value="${E(r[2])}"><input data-i="${i}" data-j="3" inputmode="decimal" placeholder="Amount" value="${E(r[3])}"></div>`).join("")}<div class="r"><button class="g" id="ad">+ Add service</button><button class="g" id="rm">Remove last</button></div></div>
 <div class="c" ${F.co=="C"?"hidden":""}><label>GST</label><select id="gm">${o("none","No GST",F.gm)}${o("ex","GST extra (added on top)",F.gm)}${o("in","GST included in price",F.gm)}</select><label><input type="checkbox" id="is" style="width:auto;min-height:0" ${F.is?"checked":""}> Customer is in another state (IGST)</label></div>
 <div class="c"><label>Discount (₹)</label><input id="dc" inputmode="decimal" value="${F.dc}"></div>
 <div class="c"><label>Scope of work (optional)</label><select id="tp"><option value="">None / keep as is<option value="house">House deep cleaning template</select><textarea id="sp" rows="5" placeholder="One point per line">${E((F.sc.points||[]).join("\n"))}</textarea><label>Exclusions</label><textarea id="sx" rows="3">${E(F.sc.exclusions||"")}</textarea></div>
 <button class="w" id="sv">Save as draft</button>`;
 $("#tp").onchange=()=>{rd();const t=TPL[$("#tp").value];if(t)F.sc={title:t.t,points:t.p,exclusions:t.x};draw()};$("#k").onchange=$("#co").onchange=()=>{rd();draw()};$("#ad").onclick=()=>{rd();F.it.push(["","","",""]);draw()};$("#rm").onclick=()=>{rd();if(F.it.length>1)F.it.pop();draw()};$("#sv").onclick=save};
 const rd=()=>{F.k=$("#k").value;F.co=$("#co").value;F.cu=+$("#cu").value;F.dt=$("#dt").value;F.gm=$("#gm").value;F.is=$("#is").checked;F.dc=$("#dc").value;F.sc={title:F.sc.title||"",points:$("#sp").value.split("\n").map(x=>x.trim()).filter(Boolean),exclusions:$("#sx").value.trim()};document.querySelectorAll("[data-i]").forEach(e=>F.it[e.dataset.i][e.dataset.j]=e.value)};
 const save=async()=>{rd();const b={kind:F.k,company:F.co,customer_id:F.cu,date:F.dt,gst_mode:F.gm,interstate:F.is,discount:F.dc,scope:F.sc,items:F.it.map(r=>({desc:r[0],qty:r[1],rate:r[2],amount:r[3]}))};
  try{const r=id?(await api("/documents/"+id,"PUT",b),{id}):await api("/documents","POST",b);F.done=1;location.hash="#/d/"+r.id}catch(e){fail(e)}};draw()}
async function view(id){const d=await api("/documents/"+id),t=d.totals,q=d.kind=="Q",lk=d.status=="final"&&ME.role!="super_admin";
 $("#a").innerHTML=`<h2>${E(d.number)}</h2><div class="c"><b>${E(d.customer.name)}</b> <span class="m">${E(d.customer.code)}</span><div class="m">${d.date} · ${d.status=="draft"?"Draft":"Final"} · ${ST[q?d.quote_status:d.payment_status]}${d.quotation_ref?" · from quotation":""}</div></div>
 <div class="c"><table>${d.items.map((i,k)=>`<tr><td>${E(i.desc)}${i.qty?` <span class="m">× ${E(i.qty)}</span>`:""}</td><td>${t.lines[k]?inr(t.lines[k]):""}</td></tr>`).join("")}<tr><td><b>Subtotal</b></td><td>${inr(t.subtotal)}</td></tr>${t.discount?`<tr><td>Discount</td><td>− ${inr(t.discount)}</td></tr>`:""}${d.gst_mode!="none"?`<tr><td>Taxable value</td><td>${inr(t.taxable)}</td></tr>`+(d.interstate?`<tr><td>IGST ${d.gst_rate}%</td><td>${inr(t.igst)}</td></tr>`:`<tr><td>CGST ${d.gst_rate/2}%</td><td>${inr(t.cgst)}</td></tr><tr><td>SGST ${d.gst_rate/2}%</td><td>${inr(t.sgst)}</td></tr>`):""}<tr><td><b>Grand total</b></td><td><b>${inr(t.grand)}</b></td></tr></table><div class="m" style="margin-top:6px">${E(t.words)}</div></div>
 <div class="r"><a class="b" href="/api/documents/${id}/pdf" target="_blank">Open PDF</a>${d.status=="draft"?`<button class="g" onclick="location.hash='#/edit/${id}'">Edit</button><button class="g" data-p='{"status":"final"}'>Finalise</button>`:ME.role=="super_admin"?`<button class="g" data-p='{"status":"draft"}'>Reopen</button>`:""}</div>
 <div class="r" style="margin-top:8px">${q?`<select id="ps">${["pending","accepted","rejected"].map(s=>`<option value="${s}" ${d.quote_status==s?"selected":""}>${ST[s]}`).join("")}${d.quote_status=="converted"?'<option selected>Converted':""}</select>${d.quote_status!="converted"?'<button id="cv">Convert to invoice</button>':""}`:`<select id="ps">${["unpaid","partial","paid"].map(s=>`<option value="${s}" ${d.payment_status==s?"selected":""}>${ST[s]}`).join("")}</select>`}</div>`;
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{try{await api("/documents/"+id,"PATCH",JSON.parse(b.dataset.p));view(id)}catch(e){fail(e)}});
 $("#ps").onchange=async e=>{try{await api("/documents/"+id,"PATCH",q?{quote_status:e.target.value}:{payment_status:e.target.value});view(id)}catch(x){fail(x)}};
 if($("#cv"))$("#cv").onclick=async()=>{try{const i=await api("/documents/"+id+"/convert","POST");location.hash="#/d/"+i.id}catch(e){fail(e)}}}
async function custs(){const l=await api("/customers"),c={};
 const draw=l=>{$("#a").innerHTML=`<h2>Customers</h2><div class="c"><b>Add customer</b><label>Name</label><input id="n"><label>Phone</label><input id="p" inputmode="tel"><label>Email</label><input id="m" type="email"><label>Billing address</label><textarea id="ad" rows="2"></textarea><label>GSTIN (optional)</label><input id="g"><label>Type</label><select id="ty"><option>Individual<option>Business<option>Institution</select><button class="w" id="sv">Save customer</button></div><div class="c">${l.map(x=>`<div class="li"><div><b>${E(x.name)}</b><div class="m">${E(x.code)} · ${E(x.phone)}</div></div></div>`).join("")}</div>`;
  $("#sv").onclick=async()=>{try{await api("/customers","POST",{name:$("#n").value,phone:$("#p").value,email:$("#m").value,address:$("#ad").value,gstin:$("#g").value.toUpperCase(),type:$("#ty").value});custs()}catch(e){fail(e)}}};draw(l)}
async function sets(){CFG=await api("/settings");const adm=ME.role=="super_admin",us=adm?await api("/users"):[];
 $("#a").innerHTML=`<h2>Settings</h2><div class="c"><label>UPI ID (shown on invoices)</label><input id="up" value="${E(CFG.upi_id)}" ${adm?"":"disabled"}><label>GST rate %</label><input id="gr" inputmode="decimal" value="${CFG.gst_rate}" ${adm?"":"disabled"}>${adm?'<button class="w" id="ss">Save</button>':'<div class="m">Only the super admin can change these.</div>'}</div>
 <div class="c"><b>Change my password</b><label>Current</label><input id="cp" type="password"><label>New (8+ characters)</label><input id="np" type="password"><button class="w" id="pw">Change password</button></div>
 ${adm?`<div class="c"><b>Team</b>${us.map(u=>`<div class="li"><div>${E(u.name)}<div class="m">${E(u.email)} · ${u.role=="super_admin"?"Super admin":"Staff"}${u.active?"":" · Disabled"}</div></div>${u.id!=ME.id?`<button class="g" data-u="${u.id}" data-a="${u.active?0:1}">${u.active?"Disable":"Enable"}</button>`:""}</div>`).join("")}<h3>Add team member</h3><label>Name</label><input id="un"><label>Email</label><input id="ue" type="email"><label>Password (8+ characters)</label><input id="up2" type="text"><button class="w" id="au">Create user</button></div>`:""}<button class="w g" id="lo">Log out</button>`;
 if(adm){$("#ss").onclick=async()=>{try{await api("/settings/upi_id","PUT",{value:$("#up").value.trim()});await api("/settings/gst_rate","PUT",{value:+$("#gr").value});alert("Saved")}catch(e){fail(e)}};
  $("#au").onclick=async()=>{try{await api("/users","POST",{name:$("#un").value,email:$("#ue").value,password:$("#up2").value});sets()}catch(e){fail(e)}};
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{try{await api("/users/"+b.dataset.u,"PATCH",{active:b.dataset.a=="1"});sets()}catch(e){fail(e)}})}
 $("#pw").onclick=async()=>{try{await api("/password","POST",{current:$("#cp").value,new:$("#np").value});alert("Password changed");sets()}catch(e){fail(e)}};
 $("#lo").onclick=async()=>{await api("/logout","POST");ME=null;go()}}
addEventListener("hashchange",go);go();
</script></body></html>
